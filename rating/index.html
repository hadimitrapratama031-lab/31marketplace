<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Reviews — 31 Store</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><header class="navbar"><a class="brand" href="../"><span class="brand-mark">31</span><span>31 Store</span></a><nav class="nav-links"><a class="nav-link" href="../">Home</a><a class="nav-link" href="../#product">Product</a><a class="nav-link" href="../#faq">FAQ</a><a class="nav-link" href="../#contact">Contact</a><a class="nav-link active" href="./">Rating</a></nav><a class="order-button" href="../cek-pesanan/">Cek Pesanan <span class="arrow">↗</span></a></header>
<main>
  <section class="section">
    <div class="section-heading reveal visible"><div><span class="eyebrow">CUSTOMER REVIEWS</span><h2>Customer <span>Reviews.</span></h2></div><p>Lihat pengalaman customer yang telah berbelanja di store kami.</p></div>
    <div class="product-grid" id="reviews"><p style="color:#8a8093;font-size:13px">Memuat ulasan...</p></div>
  </section>

  <section class="section" style="max-width:560px">
    <div class="section-heading" style="display:block"><span class="eyebrow">SHARE YOUR EXPERIENCE</span><h2>Beri <span>Ulasan.</span></h2><p style="margin-top:10px">Ulasan kamu akan tampil setelah ditinjau oleh admin.</p></div>
    <form id="review-form" class="feature-card" style="padding:26px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:8px">Nama</label>
      <input id="rv-user" required placeholder="Nama kamu" style="width:100%;padding:13px;border:1px solid #e4ddec;border-radius:11px;outline:none;font:13px Inter;margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:8px">Rating</label>
      <select id="rv-rating" style="width:100%;padding:13px;border:1px solid #e4ddec;border-radius:11px;outline:none;font:13px Inter;margin-bottom:12px">
        <option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option><option value="3">★★★☆☆ (3)</option><option value="2">★★☆☆☆ (2)</option><option value="1">★☆☆☆☆ (1)</option>
      </select>
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:8px">Review</label>
      <textarea id="rv-review" required rows="3" placeholder="Ceritakan pengalaman kamu" style="width:100%;padding:13px;border:1px solid #e4ddec;border-radius:11px;outline:none;font:13px Inter;resize:vertical;margin-bottom:8px"></textarea>
      <p id="review-msg" style="font-size:12px;margin-bottom:10px;min-height:14px"></p>
      <button class="primary-button" id="review-submit" type="submit" style="border:0;cursor:pointer;width:100%;justify-content:center">Kirim Review</button>
    </form>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  function reviewCard(r) {
    const stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
    return `<article class="feature-card">
      <div class="icon">★</div>
      <h3>${MP.escapeHTML(r.user)}</h3>
      <p style="color:#7650bd;font-weight:800;margin:10px 0">${stars}</p>
      <p>${MP.escapeHTML(r.review)}</p>
      <small style="display:block;margin-top:15px;color:#aaa">${MP.formatDate(r.createdAt)}</small>
    </article>`;
  }

  async function loadReviews() {
    try {
      const res = await MP.get("/ratings");
      const reviews = res.data || [];
      $("reviews").innerHTML = reviews.length
        ? reviews.map(reviewCard).join("")
        : `<p style="color:#8a8093;font-size:13px">Belum ada ulasan. Jadilah yang pertama memberi review!</p>`;
    } catch (err) {
      $("reviews").innerHTML = `<p style="color:#c0392b;font-size:13px">Gagal memuat ulasan.</p>`;
      console.error(err);
    }
  }

  $("review-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("review-submit");
    const msg = $("review-msg");
    msg.style.color = "#7d7485";
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Mengirim...";
    try {
      const res = await MP.post("/ratings", {
        user: $("rv-user").value.trim(),
        rating: Number($("rv-rating").value),
        review: $("rv-review").value.trim(),
      });
      msg.style.color = "#1b8a4c";
      msg.textContent = res.message || "Terima kasih! Review kamu menunggu moderasi.";
      e.target.reset();
    } catch (err) {
      msg.style.color = "#c0392b";
      msg.textContent = err.message || "Gagal mengirim review.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Kirim Review";
    }
  });

  loadReviews();
  const socket = MP.getSocket();
  if (socket) socket.on("rating:updated", MP.debounce(loadReviews, 300));
})();
</script>
</body></html>
